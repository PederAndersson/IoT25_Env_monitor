services:
  api:
    build: .
    container_name: iot-api-container
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  mqtt_receiver:
    build: .
    container_name: iot-mqtt-receiver
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "-m", "src.iot_receiver.mqtt_receiver"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data:z
    restart: unless-stopped
